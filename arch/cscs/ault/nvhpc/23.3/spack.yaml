spack:
  specs:
    - nvhpc@23.3
    - "cmake@3.24:"
    - "hdf5@1.12: +fortran +hl ~mpi %nvhpc@23.3"

  concretizer:
    unify: true
    reuse: true

  # Site NVHPC on ault only goes up to 21.3, so nvhpc@23.3 is spack-installed
  # from the NVIDIA tarball (no external). cuda@12.0 comes bundled with it.
  packages:
    gcc:
      externals:
        - spec: gcc@8.5.0 languages:='c,c++,fortran'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc
              cxx: /usr/bin/g++
              fortran: /usr/bin/gfortran
